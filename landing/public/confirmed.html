<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Email confirmed — PlanWise</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #F9F9F9;
    --text:      #1A1C1C;
    --muted:     #4C4546;
    --card:      #EEEEEE;
    --line:      #1A1C1C;
    --accent:    #00D1FF;
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--line);
    padding: 40px 32px;
    text-align: center;
  }
  .logo {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1;
  }
  .logo strong {
    display: block;
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    color: var(--text);
    margin-top: 4px;
  }
  .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 28px auto 20px;
    font-size: 26px;
    font-weight: 800;
    color: #1A1C1C;
  }
  h1 {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 10px;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .hint {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #E5E5E5;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }
  a { color: var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Plan<strong>Wise</strong></div>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Your email is confirmed</h1>
    <p>Your account is active — you can close this tab.</p>
    <p>Open the PlanWise extension icon in your browser toolbar and sign in with your email or username.</p>
    <div class="hint">Don't see the extension icon? Pin it from your browser's extensions menu.</div>
  </div>
</body>
</html>
